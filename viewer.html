<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser 3D</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #c8c8c8;
    font: 12px/1.35 -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  canvas { display: block; }
  #rig { position: absolute; top: 40px; right: 8px; max-height: calc(100vh - 48px); overflow-y: auto; width: 240px; padding: 6px 8px; background: rgba(35, 35, 35, .92);
    border: 1px solid #121212; border-radius: 2px; }
  #rig.hidden { display: none; }
  #rig label.with-button select { grid-column: 2 / 3; }
  #rig label.wide select { grid-column: 2 / 4; }
  #rig .assign { margin: 4px 0; padding: 4px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; }
  #rig .assign-head { font-size: 11px; color: #8b8b8b; margin-bottom: 2px; }
  #rig label.wide input[type=text] { grid-column: 2 / 4; height: 20px; padding: 0 4px; color: #c8c8c8; background: #1b1b1b; border: 1px solid #121212; border-radius: 2px; font: inherit; }
  #rig label.with-button button { height: 20px; padding: 0; color: #c8c8c8; background: #1b1b1b; border: 1px solid #121212; border-radius: 2px; font: inherit; font-size: 11px; }
  #stats { position: absolute; left: 8px; top: 8px; padding: 2px 6px; color: #8b8b8b; background: rgba(0, 0, 0, .6); font: 11px/1.4 monospace; }
  .tip { position: fixed; z-index: 10; max-width: 260px; padding: 4px 7px; border: 1px solid #383838; border-radius: 2px; background: #101010; color: #c8c8c8; font-size: 11px; line-height: 1.45; white-space: pre-line; pointer-events: none; }
  .tip[hidden] { display: none; }
  #rig-toggle { position: absolute; top: 8px; right: 8px; height: 26px; padding: 0 12px; color: #c8c8c8; background: rgba(35, 35, 35, .92);
    border: 1px solid #121212; border-radius: 2px; font: inherit; }
  @media (max-width: 600px) { #rig { left: 8px; width: auto; } }
  #rig h3 { margin: 0 0 4px; font-size: 11px; font-weight: 600; }
  #rig label { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; gap: 6px; min-height: 22px; color: #8b8b8b; }
  #rig input { width: 100%; accent-color: #4d8fd6; }
  #rig select { grid-column: 2 / 4; height: 20px; color: #c8c8c8; background: #1b1b1b; border: 1px solid #121212; border-radius: 2px; font: inherit; }
  #rig output { text-align: right; font-variant-numeric: tabular-nums; color: #c8c8c8; }
  #rig p { margin: 6px 0 0; color: #6f6f6f; font-size: 11px; }
</style>
</head>
<body>
<button id="rig-toggle"></button>
<div id="rig"></div>
<script type="module" src="/src/viewer/main.ts"></script>
</body>
</html>
